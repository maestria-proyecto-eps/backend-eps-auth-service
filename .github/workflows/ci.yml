# CI - backend-eps-auth-service
# Runs on PRs targeting develop, qa, main

name: CI

on:
  pull_request:
    branches: [develop, qa, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install flake8 -r requirements.txt
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: flake8 . --count --max-line-length=120 --statistics --exit-zero

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Initialise test database
        env:
          PGPASSWORD: testpassword
        run: psql -h localhost -U postgres -d test_db -f tests/init.sql
      - name: Run tests
        env:
          DB_ADMIN_HOST: localhost
          DB_ADMIN_USER: postgres
          DB_ADMIN_PASSWORD: testpassword
          DB_ADMIN_NAME: test_db
          DB_ADMIN_PORT: "5432"
          DB_ADMIN_SSLMODE: disable
          JWT_SECRET: clave_secreta_ci
          JWT_ALGORITHM: HS256
          JWT_EXPIRES_MINUTES: "480"
        run: |
          if [ -d "tests" ] && find tests -name "test_*.py" | grep -q .; then
            pip install pytest
            PYTHONPATH=. pytest tests/ -v
          else
            echo "No tests found — skipping"
          fi

  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source branch
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"
          echo "PR: $SOURCE → $TARGET"

          # main solo acepta PRs desde qa o hotfix/*
          if [[ "$TARGET" == "main" && "$SOURCE" != "qa" && ! "$SOURCE" =~ ^hotfix/ ]]; then
            echo "❌ PRs a main solo se permiten desde qa o hotfix/*"
            exit 1
          fi

          # qa solo acepta PRs desde develop
          if [[ "$TARGET" == "qa" && "$SOURCE" != "develop" ]]; then
            echo "❌ PRs a qa solo se permiten desde develop"
            exit 1
          fi

          echo "✅ Branch policy OK: $SOURCE → $TARGET"
